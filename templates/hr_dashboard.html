{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR Dashboard | Smart Factory Jobs</title>
  <!-- Bootstrap 5 (CSS first, then our own style.css so our rules win on ties) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="top">
    <a href="{% url 'hr-dashboard' %}" class="brand">🏭 HR Dashboard</a>
    <nav>
      <a href="{% url 'job-portal' %}">Job Portal</a>
      <a href="/admin/">Admin</a>
      <form method="post" action="/api-auth/logout/?next={% url 'job-portal' %}">
        {% csrf_token %}
        <button type="submit">Logout ({{ user.username }})</button>
      </form>
    </nav>
  </header>

  <main>
    <div class="tabs">
      <button class="tab-btn on" data-tab="applications">Applications</button>
      <button class="tab-btn" data-tab="jobs">Manage Jobs</button>
    </div>

    <!-- ===================== Applications tab ===================== -->
    <section id="tab-applications">
      <div class="toolbar">
        <h1>Applications</h1>
        <select id="status-filter"></select>
        <span id="count" class="muted"></span>
      </div>
      <div style="overflow-x:auto">
        <table class="stack">
          <thead>
            <tr>
              <th>Candidate</th>
              <th>Job</th>
              <th>Applied</th>
              <th>Status</th>
              <th>AI Match Score</th>
              <th>Safety Questions</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="6" class="muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- ===================== Manage Jobs tab ===================== -->
    <section id="tab-jobs" hidden>
      <div class="toolbar">
        <h1>Manage Jobs</h1>
        <span id="job-count" class="muted"></span>
      </div>

      <details class="card" id="job-form-card" open>
        <summary>+ Post a new job</summary>
        <form id="job-form" style="margin-top:14px">
          <div class="cols">
            <label>Title <input name="title" required></label>
            <label>Department <input name="department" required></label>
            <label>Location <input name="location" required></label>
            <label>Hourly rate (PKR) <input name="hourly_rate" type="number" step="0.01" min="0.01" required></label>
            <label>Shift
              <select name="shift">
                <option value="day">Day</option>
                <option value="night">Night</option>
                <option value="rotating">Rotating</option>
                <option value="any">Any</option>
              </select>
            </label>
            <label>Required certifications <input name="required_certifications" placeholder="Optional"></label>
          </div>
          <label>Description <textarea name="description" rows="3" required></textarea></label>
          <p id="job-form-msg" class="err"></p>
          <button type="submit" class="primary">Post job</button>
        </form>
      </details>

      <div id="jobs-manage" class="grid"><p class="muted">Loading…</p></div>
    </section>
  </main>

  <!-- ===================== Bootstrap Modal: Safety Screening Questions ===================== -->
  <div class="modal fade" id="safetyModal" tabindex="-1" aria-labelledby="safetyModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="safetyModalLabel">Safety Screening Questions</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted" id="safety-modal-subtitle"></p>
          <ol id="safety-questions-list" class="mb-0"></ol>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="{% static 'js/common.js' %}"></script>
  <!-- Bootstrap JS bundle (includes Popper) — needed for the modal above -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/hr_dashboard.js' %}"></script>
</body>
</html>
